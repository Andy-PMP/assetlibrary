<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Browser</title>
<style>
  :root {
    --bg: #f4f4f6; --panel: #ffffff; --text: #1d1d22; --muted: #6b6b76;
    --border: #dcdce2; --accent: #3b6fe0; --accent-text: #ffffff;
    --check-a: #e6e6ea; --check-b: #f8f8fa;
    --tag-bg: #e3ebfc; --tag-text: #24448f; --warn: #b5600b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --panel: #212127; --text: #e8e8ec; --muted: #9a9aa6;
      --border: #34343c; --accent: #5b8bf5; --accent-text: #ffffff;
      --check-a: #2a2a31; --check-b: #33333b;
      --tag-bg: #2c3a5c; --tag-text: #c9d8ff; --warn: #f0a24a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }

  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
           border-bottom: 1px solid var(--border); padding: 12px 16px;
           display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  #search { flex: 1 1 260px; min-width: 0; padding: 8px 12px; font-size: 14px;
            border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg); color: var(--text); }
  .filters { display: flex; gap: 4px; }
  .filters button { padding: 7px 14px; border: 1px solid var(--border); border-radius: 6px;
                    background: var(--bg); color: var(--text); cursor: pointer; font-size: 13px; }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  label.opt { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  #count { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  .btn { padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px;
         background: var(--bg); color: var(--text); cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:disabled { opacity: .45; cursor: default; }
  #unsynced { color: var(--warn); font-size: 13px; white-space: nowrap; }

  main { padding: 16px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
          overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .thumb { height: 150px; display: flex; align-items: center; justify-content: center;
           background-color: var(--check-b);
           background-image: linear-gradient(45deg, var(--check-a) 25%, transparent 25%),
                             linear-gradient(-45deg, var(--check-a) 25%, transparent 25%),
                             linear-gradient(45deg, transparent 75%, var(--check-a) 75%),
                             linear-gradient(-45deg, transparent 75%, var(--check-a) 75%);
           background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; padding: 6px; }
  body.pixelated .thumb img, body.pixelated #lightbox img { image-rendering: pixelated; }
  .thumb.audio { background: var(--bg); flex-direction: column; gap: 10px; padding: 8px; }
  .thumb.audio .icon { font-size: 36px; opacity: .6; }
  .thumb.audio audio { width: 100%; }
  .thumb.other { background: var(--bg); color: var(--muted); font-size: 22px; font-weight: 600; }
  .info { padding: 8px 10px; min-width: 0; }
  .name, .folder, .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name { font-weight: 600; }
  .folder, .meta { color: var(--muted); font-size: 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { display: inline-flex; align-items: center; max-width: 100%; border: none; border-radius: 10px;
         padding: 1px 2px 1px 8px; background: var(--tag-bg); color: var(--tag-text);
         font-size: 11px; cursor: pointer; }
  .tag span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag .x { padding: 0 5px; opacity: .55; }
  .tag .x:hover { opacity: 1; }
  .add-tag { border: 1px dashed var(--border); border-radius: 10px; padding: 1px 8px;
             background: none; color: var(--muted); font-size: 11px; cursor: pointer; }
  .tag-input { width: 100%; padding: 2px 6px; font-size: 12px; border: 1px solid var(--accent);
               border-radius: 6px; background: var(--bg); color: var(--text); }

  #sentinel { height: 1px; }
  #empty, #loader { text-align: center; color: var(--muted); padding: 60px 16px; }
  #loader input { margin-top: 12px; }

  #lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.88);
              display: none; flex-direction: column; }
  #lightbox.open { display: flex; }
  #lightbox .stage { flex: 1; overflow: auto; display: flex; padding: 16px; }
  #lightbox img { margin: auto; max-width: none; background-color: #fff;
                  background-image: linear-gradient(45deg, #ddd 25%, transparent 25%),
                                    linear-gradient(-45deg, #ddd 25%, transparent 25%),
                                    linear-gradient(45deg, transparent 75%, #ddd 75%),
                                    linear-gradient(-45deg, transparent 75%, #ddd 75%);
                  background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
  #lightbox .caption { color: #ddd; padding: 10px 16px; font-size: 13px; word-break: break-all; }
  #lightbox .close { position: absolute; top: 10px; right: 14px; background: none; border: none;
                     color: #fff; font-size: 32px; line-height: 1; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Asset Browser</h1>
  <input id="search" type="search" placeholder="Search filename, folder or tag…" autocomplete="off">
  <div class="filters">
    <button data-kind="all" class="active">All</button>
    <button data-kind="image">Images</button>
    <button data-kind="audio">Audio</button>
  </div>
  <label class="opt"><input type="checkbox" id="pixelated"> Pixel art scaling</label>
  <span id="count"></span>
  <button class="btn" id="tagResults" title="Add tags to every asset currently shown">Tag results…</button>
  <span id="unsynced" hidden></span>
  <button class="btn" id="exportTags" disabled
          title="Download tags.json, then run: python import_tags.py">Export tags</button>
</header>
<datalist id="allTags"></datalist>

<main>
  <div id="loader" hidden>
    <p>No data found. Run <code>export_json.py</code> so <code>assets_data.js</code> sits next to this file,<br>
       or load <code>assets.json</code> manually:</p>
    <input type="file" id="jsonFile" accept=".json,application/json">
  </div>
  <div id="grid"></div>
  <div id="empty" hidden>No assets match.</div>
  <div id="sentinel"></div>
</main>

<div id="lightbox">
  <button class="close" title="Close (Esc)">&times;</button>
  <div class="stage"><img alt=""></div>
  <div class="caption"></div>
</div>

<script src="assets_data.js"></script>
<script>
(function () {
  const PAGE = 200;
  const grid = document.getElementById('grid');
  const sentinel = document.getElementById('sentinel');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');
  const lightbox = document.getElementById('lightbox');
  const lbImg = lightbox.querySelector('img');
  const lbCaption = lightbox.querySelector('.caption');
  const unsyncedEl = document.getElementById('unsynced');
  const exportBtn = document.getElementById('exportTags');
  const tagList = document.getElementById('allTags');

  // Tag edits not yet imported into assets.db: { path: [full sorted tag list] }
  const TAGS_KEY = 'assetBrowser.tagEdits';
  let edits = loadEdits();

  let assets = [];
  let filtered = [];
  let rendered = 0;
  let kindFilter = 'all';

  function setData(data) {
    assets = data.map(a => {
      a._dbTags = (a.tags || []).slice().sort();
      a.tags = a._dbTags;
      const local = edits[a.path];
      if (local) {
        // Already synced to the DB (import_tags.py + re-export) -> drop the local copy
        if (sameTags(local, a._dbTags)) delete edits[a.path];
        else a.tags = local;
      }
      a._search = searchText(a);
      return a;
    });
    saveEdits();
    refreshTagList();
    document.getElementById('loader').hidden = true;
    applyFilters();
  }

  function searchText(a) {
    return (a.filename + ' ' + a.folder + ' ' + (a.pack || '') + ' ' + a.tags.join(' ')).toLowerCase();
  }

  // --- Tags ---
  function loadEdits() {
    try { return JSON.parse(localStorage.getItem(TAGS_KEY)) || {}; }
    catch (e) { return {}; }
  }

  function saveEdits() {
    try { localStorage.setItem(TAGS_KEY, JSON.stringify(edits)); }
    catch (e) {
      alert('Could not save tag edits in this browser (' + e.name + '). ' +
            'Click "Export tags" now so they aren\'t lost.');
    }
    const n = Object.keys(edits).length;
    unsyncedEl.hidden = n === 0;
    unsyncedEl.textContent = n.toLocaleString() + ' unsynced';
    unsyncedEl.title = 'Tag edits saved in this browser only. Export them, then run ' +
                       'import_tags.py to save them to assets.db.';
    exportBtn.disabled = n === 0;
  }

  function normalizeTag(t) { return t.toLowerCase().trim().replace(/\s+/g, ' '); }
  function parseTags(text) { return text.split(',').map(normalizeTag).filter(Boolean); }
  function sameTags(x, y) { return x.length === y.length && x.every((t, i) => t === y[i]); }

  function setTags(a, tags) {
    a.tags = [...new Set(tags)].sort();
    a._search = searchText(a);
    if (sameTags(a.tags, a._dbTags)) delete edits[a.path];
    else edits[a.path] = a.tags;
  }

  function commitTags(a, tags) {
    setTags(a, tags);
    saveEdits();
    refreshTagList();
  }

  function refreshTagList() {
    const all = new Set();
    assets.forEach(a => a.tags.forEach(t => all.add(t)));
    const frag = document.createDocumentFragment();
    [...all].sort().forEach(t => { const o = el('option'); o.value = t; frag.appendChild(o); });
    tagList.replaceChildren(frag);
  }

  function renderTags(box, a) {
    box.replaceChildren();
    a.tags.forEach(t => {
      const chip = el('button', 'tag');
      chip.title = 'Search for "' + t + '"';
      chip.dataset.tag = t;
      chip.appendChild(el('span', null, t));
      const x = el('span', 'x', '×');
      x.title = 'Remove tag';
      chip.appendChild(x);
      box.appendChild(chip);
    });
    box.appendChild(el('button', 'add-tag', '+ tag'));
  }

  function openTagInput(box, a, addBtn) {
    const input = el('input', 'tag-input');
    input.setAttribute('list', 'allTags');
    input.placeholder = 'tag, another tag';
    addBtn.replaceWith(input);
    input.focus();
    let done = false;
    const finish = commit => {
      if (done) return;
      done = true;
      const added = commit ? parseTags(input.value) : [];
      if (added.length) commitTags(a, a.tags.concat(added));
      renderTags(box, a);
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') finish(true);
      else if (e.key === 'Escape') { e.stopPropagation(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
  }

  function applyFilters() {
    const terms = searchEl.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    filtered = assets.filter(a =>
      (kindFilter === 'all' || a.kind === kindFilter) &&
      terms.every(t => a._search.includes(t)));
    grid.replaceChildren();
    rendered = 0;
    renderMore();
    countEl.textContent = filtered.length.toLocaleString() + ' of ' + assets.length.toLocaleString();
    emptyEl.hidden = filtered.length > 0 || assets.length === 0;
  }

  function renderMore() {
    const frag = document.createDocumentFragment();
    const end = Math.min(rendered + PAGE, filtered.length);
    for (let i = rendered; i < end; i++) frag.appendChild(makeCard(filtered[i], i));
    grid.appendChild(frag);
    rendered = end;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function formatSize(kb) {
    return kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb.toFixed(1) + ' KB';
  }

  function makeCard(a, index) {
    const card = el('div', 'card');
    let thumb;
    if (a.kind === 'image') {
      thumb = el('div', 'thumb');
      const img = el('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = a.filename;
      img.src = a.url;
      img.dataset.index = index;
      thumb.appendChild(img);
    } else if (a.kind === 'audio') {
      thumb = el('div', 'thumb audio');
      thumb.appendChild(el('div', 'icon', '♫'));
      const audio = el('audio');
      audio.controls = true;
      audio.preload = 'none';
      audio.src = a.url;
      thumb.appendChild(audio);
    } else {
      thumb = el('div', 'thumb other', '.' + (a.ext || '?'));
    }
    card.appendChild(thumb);

    const info = el('div', 'info');
    const name = el('div', 'name', a.filename);
    name.title = a.path;
    info.appendChild(name);
    const folder = el('div', 'folder',
      a.pack && a.pack !== a.folder ? a.pack + ' / ' + a.folder : a.folder);
    folder.title = folder.textContent;
    info.appendChild(folder);
    const meta = [a.ext.toUpperCase(), formatSize(a.size_kb)];
    if (a.width) meta.push(a.width + '×' + a.height);
    info.appendChild(el('div', 'meta', meta.join(' · ')));
    const tagBox = el('div', 'tags');
    tagBox.dataset.index = index;
    renderTags(tagBox, a);
    info.appendChild(tagBox);
    card.appendChild(info);
    return card;
  }

  // Infinite scroll
  new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && rendered < filtered.length) renderMore();
  }, { rootMargin: '800px' }).observe(sentinel);

  // Search (debounced)
  let timer;
  searchEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(applyFilters, 150);
  });

  // Kind filter buttons
  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      kindFilter = btn.dataset.kind;
      applyFilters();
    });
  });

  // Pixel-art scaling toggle
  document.getElementById('pixelated').addEventListener('change', e => {
    document.body.classList.toggle('pixelated', e.target.checked);
  });

  // Tag chips: click to search, × to remove, "+ tag" to add
  grid.addEventListener('click', e => {
    const box = e.target.closest('.tags');
    if (!box) return;
    const a = filtered[box.dataset.index];
    const chip = e.target.closest('.tag');
    if (e.target.closest('.x')) {
      commitTags(a, a.tags.filter(t => t !== chip.dataset.tag));
      renderTags(box, a);
    } else if (chip) {
      searchEl.value = chip.dataset.tag;
      applyFilters();
    } else if (e.target.closest('.add-tag')) {
      openTagInput(box, a, e.target.closest('.add-tag'));
    }
  });

  // Bulk-tag everything matching the current search/filter
  document.getElementById('tagResults').addEventListener('click', () => {
    if (!filtered.length) return;
    const text = prompt('Add tags to all ' + filtered.length.toLocaleString() +
                        ' assets shown (comma-separated):');
    const added = text ? parseTags(text) : [];
    if (!added.length) return;
    filtered.forEach(a => setTags(a, a.tags.concat(added)));
    saveEdits();
    refreshTagList();
    grid.querySelectorAll('.tags').forEach(box => renderTags(box, filtered[box.dataset.index]));
  });

  // Download pending edits for import_tags.py
  exportBtn.addEventListener('click', () => {
    const json = JSON.stringify({ version: 1, exported: new Date().toISOString(), tags: edits }, null, 1);
    const link = el('a');
    link.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    link.download = 'tags.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });

  // Only one audio plays at a time
  document.addEventListener('play', e => {
    document.querySelectorAll('audio').forEach(a => { if (a !== e.target) a.pause(); });
  }, true);

  // Lightbox
  grid.addEventListener('click', e => {
    const img = e.target.closest('.thumb img');
    if (!img) return;
    const a = filtered[img.dataset.index];
    lbImg.src = a.url;
    lbCaption.textContent = a.path + (a.width ? '  (' + a.width + '×' + a.height + ')' : '');
    lightbox.classList.add('open');
  });
  function closeLightbox() { lightbox.classList.remove('open'); lbImg.removeAttribute('src'); }
  lightbox.addEventListener('click', e => { if (e.target !== lbImg) closeLightbox(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  // Data loading
  if (Array.isArray(window.ASSETS)) {
    setData(window.ASSETS);
  } else {
    document.getElementById('loader').hidden = false;
    countEl.textContent = '';
    document.getElementById('jsonFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { setData(JSON.parse(reader.result)); }
        catch (err) { alert('Could not parse JSON: ' + err.message); }
      };
      reader.readAsText(file);
    });
  }
})();
</script>
</body>
</html>
